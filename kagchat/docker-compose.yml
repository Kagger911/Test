# Local test stack. Run this before touching the cluster.
#
#   docker compose up --build
#   open http://localhost:8081
#
# Host port is 8081 (Pi-hole has 8080 on Erebus). Override: KAGCHAT_PORT=8090 docker compose up
#
# Redis here matches the cluster config: memory only, nothing on disk.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["--save", "", "--appendonly", "no", "--maxmemory", "256mb"]
    # The relay exits if Redis is not answering when it starts, so wait for a
    # PONG rather than for the container to merely exist.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  relay:
    restart: unless-stopped
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        BUILD: "${BUILD:-dev}"
    environment:
      REDIS_ADDR: "redis:6379"
    ports:
      - "${KAGCHAT_PORT:-8081}:8080"
    depends_on:
      redis:
        condition: service_healthy
