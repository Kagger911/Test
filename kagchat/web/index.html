<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>kagchat</title>

<!--
  PRIVACY CONSTRAINT: this file loads nothing from the network except its own
  WebSocket. No web fonts, no CDN, no analytics. A single external request
  would hand your visitor list to a third party, which would undo the point of
  encrypting the messages. If you add a library, vendor it into this file.
-->

<style>
  /* ---------------------------------------------------------------------
     Design tokens. Change colours here, not further down.
     --------------------------------------------------------------------- */
  :root {
    --ink:      #14121C;  /* page ground: deep violet-black, 4am */
    --panel:    #1C1927;  /* raised surfaces */
    --line:     #2A2637;  /* hairlines */
    --text:     #D7D3E2;  /* body */
    --dim:      #797292;  /* metadata, timestamps */
    --sodium:   #F0C05A;  /* single accent: sodium streetlight */
    --alert:    #E0645C;  /* errors only */

    --ui:   ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  /* #gate and #app both set display: below, which outranks the browser's own
     [hidden] { display: none } rule. Without this, hidden="" is ignored and
     the entry screen stays painted over the chat forever. */
  [hidden] { display: none !important; }

  html, body {
    margin: 0; height: 100%;
    background: var(--ink); color: var(--text);
    font-family: var(--ui);
    font-size: 15px; line-height: 1.5;
  }

  /* Two panes: a narrow status rail, then the message river. */
  #app { display: grid; grid-template-columns: 232px 1fr; height: 100%; }

  /* --- left rail -------------------------------------------------------- */
  #rail {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 20px 18px;
    display: flex; flex-direction: column; gap: 22px;
    overflow-y: auto;
  }

  #mark { font-size: 19px; letter-spacing: -0.01em; font-weight: 600; }
  #mark span { color: var(--sodium); }

  .field { display: block; }
  .field > label {
    display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px;
  }
  .field input {
    width: 100%; padding: 7px 9px;
    background: var(--ink); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px;
    font: inherit;
  }
  .field input:focus { outline: 2px solid var(--sodium); outline-offset: 1px; }

  /* The memorable element: the room's own countdown to forgetting. */
  #decay {
    border-top: 1px solid var(--line);
    padding-top: 16px; margin-top: auto;
  }
  #decay b {
    display: block;
    font-family: var(--mono); font-size: 26px; font-weight: 400;
    color: var(--sodium); letter-spacing: -0.02em;
  }
  #decay small { color: var(--dim); font-size: 12px; }

  #fp { font-family: var(--mono); font-size: 12px; color: var(--dim); word-break: break-all; }

  /* --- message river ---------------------------------------------------- */
  #river { display: flex; flex-direction: column; min-width: 0; }

  #log {
    flex: 1; overflow-y: auto;
    padding: 20px 26px;
    font-family: var(--mono); font-size: 13.5px; line-height: 1.7;
  }

  /* Right-aligned nick column, the way irssi and weechat lay it out.
     Alignment is the information: you scan the gutter, not the text. */
  .line { display: grid; grid-template-columns: 52px 128px 1fr; gap: 12px; }
  .line + .line { margin-top: 2px; }
  .at   { color: var(--dim); font-size: 12px; }
  .who  { color: var(--sodium); text-align: right; overflow: hidden; text-overflow: ellipsis; }
  .what { white-space: pre-wrap; word-break: break-word; min-width: 0; }

  .unsigned .who::after { content: "?"; color: var(--alert); margin-left: 3px; }
  .sys  { color: var(--dim); grid-column: 2 / -1; }
  .bad  { color: var(--alert); grid-column: 2 / -1; }

  /* --- composer --------------------------------------------------------- */
  #composer { border-top: 1px solid var(--line); padding: 14px 26px; }
  #say {
    width: 100%; padding: 11px 13px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 5px;
    font-family: var(--mono); font-size: 13.5px;
  }
  #say:focus { outline: 2px solid var(--sodium); outline-offset: 1px; }
  #say:disabled { opacity: 0.45; }

  /* --- entry screen ----------------------------------------------------- */
  #gate {
    position: fixed; inset: 0; background: var(--ink);
    display: grid; place-items: center; padding: 24px;
  }
  #gate .box { max-width: 30rem; }
  #gate h1 { font-size: 30px; margin: 0 0 12px; letter-spacing: -0.02em; }
  #gate h1 span { color: var(--sodium); }
  #gate p { color: var(--dim); margin: 0 0 22px; }
  #gate button {
    padding: 10px 18px; font: inherit; font-weight: 500;
    background: var(--sodium); color: var(--ink);
    border: 0; border-radius: 5px; cursor: pointer;
  }
  #gate button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  #invite {
    margin-top: 18px; padding: 11px; width: 100%;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 5px;
    font-family: var(--mono); font-size: 12px;
  }

  @media (max-width: 720px) {
    #app { grid-template-columns: 1fr; }
    #rail { display: none; }
  }
</style>
</head>

<body>

<!-- Shown until a room key exists. -->
<div id="gate">
  <div class="box">
    <h1>kag<span>chat</span></h1>
    <p>Rooms are opened with a key that never leaves your browser. The server
       stores scrambled text it cannot read, and forgets all of it after a day.</p>
    <button id="mkroom">Open a new room</button>
    <input id="invite" readonly hidden>
  </div>
</div>

<div id="app" hidden>
  <aside id="rail">
    <div id="mark">kag<span>chat</span></div>

    <label class="field">
      <span>Your name here</span>
      <input id="nick" maxlength="24" autocomplete="off" spellcheck="false">
    </label>

    <label class="field">
      <span>Invite link</span>
      <input id="share" readonly>
    </label>

    <div class="field">
      <label>Your fingerprint</label>
      <div id="fp">generating</div>
    </div>

    <div id="decay">
      <b id="clock">24:00</b>
      <small>until the oldest messages here are deleted</small>
    </div>
  </aside>

  <main id="river">
    <div id="log" role="log" aria-live="polite"></div>
    <div id="composer">
      <input id="say" placeholder="Connecting" autocomplete="off" disabled>
    </div>
  </main>
</div>

<script>
"use strict";
/* ===========================================================================
   HOW THE PRIVACY WORKS
   ---------------------------------------------------------------------------
   1. A room key is 32 random bytes. It lives in the part of the URL after the
      "#". Browsers never send that part to the server, so the server cannot
      learn it even though it is sitting in the address bar.

   2. The room ID the server sees is SHA-256(key). One-way: the server can
      group people into the same room without ever learning the key or the
      room's name.

   3. Every message is encrypted with AES-GCM before it is sent, and decrypted
      after it arrives. Nicknames travel inside the encrypted part, so the
      server never sees those either.

   4. Each browser makes a signing keypair on first run and signs every
      message. Others verify it. This stops impersonation without anyone ever
      registering an account. A message that fails verification is marked.

   WHAT THIS DOES NOT HIDE: your IP address from whatever sits in front of the
   server (Cloudflare, a VPS, your ISP). Encryption cannot fix that. Only
   onion routing can.
   ========================================================================= */

/* --- tiny helpers --------------------------------------------------------- */
const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();
const dec = new TextDecoder();

// base64url: URL-safe base64, no padding. Used for keys and IDs.
const b64u = {
  from: (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes)))
                     .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""),
  to: (s) => Uint8Array.from(
        atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0)),
};

/* --- room key ------------------------------------------------------------- */

// Read the key out of the URL fragment, or return null if there isn't one.
function keyFromURL() {
  const m = location.hash.match(/k=([A-Za-z0-9_-]{43})/);
  return m ? b64u.to(m[1]) : null;
}

// Make a fresh room and put its key in the address bar.
function newRoom() {
  const raw = crypto.getRandomValues(new Uint8Array(32));
  location.hash = "k=" + b64u.from(raw);
  return raw;
}

/* --- identity: a signing keypair kept in this browser only ---------------- */

// Stored in IndexedDB as a non-extractable CryptoKey. Non-extractable means
// no script — including a malicious one — can read the private key back out.
const DB = "kagchat", STORE = "id";

function idb() {
  return new Promise((ok, no) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  });
}

function idbOp(mode, fn) {
  return idb().then((db) => new Promise((ok, no) => {
    const tx = db.transaction(STORE, mode);
    const req = fn(tx.objectStore(STORE));
    req.onsuccess = () => ok(req.result);
    req.onerror = () => no(req.error);
  }));
}

// Ed25519 landed in browser crypto recently. If it is missing, we still run,
// but messages go out unsigned and every client marks them with a "?".
let canSign = true;

async function loadIdentity() {
  const saved = await idbOp("readonly", (s) => s.get("pair")).catch(() => null);
  if (saved) return saved;
  const pair = await crypto.subtle.generateKey({ name: "Ed25519" }, false, ["sign", "verify"]);
  await idbOp("readwrite", (s) => s.put(pair, "pair"));
  return pair;
}

/* --- message encryption --------------------------------------------------- */

// Turn the room's raw key into an AES key the browser can use.
async function aesKey(raw) {
  return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]);
}

// Room ID = SHA-256 of the key, shortened. This is the only thing the server
// learns about which room you are in.
async function roomID(raw) {
  const h = await crypto.subtle.digest("SHA-256", raw);
  return b64u.from(h).slice(0, 32);
}

// Encrypt one message. Output layout: [12-byte IV][ciphertext], base64url'd.
// A fresh random IV per message is mandatory for AES-GCM; reusing one breaks
// the encryption completely.
async function seal(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt(
    { name: "AES-GCM", iv }, key, enc.encode(JSON.stringify(obj)));
  const out = new Uint8Array(12 + ct.byteLength);
  out.set(iv, 0);
  out.set(new Uint8Array(ct), 12);
  return b64u.from(out);
}

// Decrypt. Returns null on failure, which is normal: anyone can push junk into
// a room, and messages from a previous key look like junk too.
async function open(key, blob) {
  try {
    const all = b64u.to(blob);
    const pt = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: all.slice(0, 12) }, key, all.slice(12));
    return JSON.parse(dec.decode(pt));
  } catch { return null; }
}

/* --- signing -------------------------------------------------------------- */

// What gets signed. Order matters: both sides must build this identically.
const signedForm = (m) => enc.encode(`${m.ts}\u0000${m.nick}\u0000${m.text}`);

async function sign(priv, m) {
  if (!canSign) return null;
  const sig = await crypto.subtle.sign("Ed25519", priv, signedForm(m));
  return b64u.from(sig);
}

async function verify(m) {
  if (!m.pub || !m.sig) return false;
  try {
    const pub = await crypto.subtle.importKey(
      "raw", b64u.to(m.pub), { name: "Ed25519" }, true, ["verify"]);
    return await crypto.subtle.verify("Ed25519", pub, b64u.to(m.sig), signedForm(m));
  } catch { return false; }
}

// A short, human-comparable form of a public key. Two people read these aloud
// to confirm they are talking to who they think.
const shortFP = (pub) => pub.slice(0, 16).replace(/(.{4})/g, "$1 ").trim();

/* --- rendering ------------------------------------------------------------ */

const log = $("log");

function paint(m, ok) {
  const wasAtBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;

  const row = document.createElement("div");
  row.className = "line" + (ok ? "" : " unsigned");

  const at = document.createElement("div");
  at.className = "at";
  at.textContent = new Date(m.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  const who = document.createElement("div");
  who.className = "who";
  who.textContent = m.nick || "anon";
  if (m.pub) who.title = "fingerprint " + shortFP(m.pub);

  const what = document.createElement("div");
  what.className = "what";
  what.textContent = m.text; // textContent, never innerHTML: that is the XSS door

  row.append(at, who, what);
  log.append(row);

  // Only auto-scroll if the reader was already at the bottom. Yanking someone
  // out of scrollback to show a new line is the most annoying thing a chat
  // client can do.
  if (wasAtBottom) log.scrollTop = log.scrollHeight;
}

function note(text, bad) {
  const row = document.createElement("div");
  row.className = "line";
  const body = document.createElement("div");
  body.className = bad ? "bad" : "sys";
  body.textContent = text;
  row.append(body);
  log.append(row);
  log.scrollTop = log.scrollHeight;
}

/* --- connection ----------------------------------------------------------- */

let sock = null;
let backoff = 500; // grows on repeated failure so we don't hammer the server

function connect(ch, onFrame) {
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
  sock = new WebSocket(url);

  sock.onopen = () => {
    backoff = 500;
    sock.send(JSON.stringify({ op: "join", ch }));
    $("say").disabled = false;
    $("say").placeholder = "Say something";
  };

  sock.onmessage = (e) => onFrame(JSON.parse(e.data));

  // Reconnect with exponential backoff. The VIM3 nodes are on WiFi and will
  // drop sockets occasionally; this makes that invisible instead of fatal.
  sock.onclose = () => {
    $("say").disabled = true;
    $("say").placeholder = "Reconnecting";
    setTimeout(() => connect(ch, onFrame), backoff);
    backoff = Math.min(backoff * 2, 15000);
  };

  sock.onerror = () => sock.close();
}

/* --- countdown ------------------------------------------------------------ */

// Counts down from 24h to show when the room starts forgetting. Restarts on
// every message, because the server's expiry is a sliding window.
let decayFrom = Date.now();
setInterval(() => {
  const left = Math.max(0, 24 * 3600e3 - (Date.now() - decayFrom));
  const h = Math.floor(left / 3600e3);
  const m = Math.floor((left % 3600e3) / 60e3);
  $("clock").textContent = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
}, 1000);

/* --- startup -------------------------------------------------------------- */

async function boot() {
  // Browsers only expose crypto.subtle in a "secure context": https, or a
  // localhost address. Served over plain http from a LAN IP it is undefined
  // and nothing below this line can work. Say so on the entry screen rather
  // than throwing somewhere in the middle of startup and leaving the input
  // greyed out with no explanation.
  if (!window.isSecureContext || !crypto.subtle) {
    const p = document.querySelector("#gate p");
    p.style.color = "var(--alert)";
    p.textContent =
      "Served over plain http from " + location.host + ", where the browser " +
      "switches off the encryption this depends on. Reach it over https, or " +
      "tunnel it to localhost: ssh -L " + (location.port || "80") + ":localhost:" +
      (location.port || "80") + " user@" + location.hostname;
    $("mkroom").disabled = true;
    return;
  }

  let raw = keyFromURL();
  if (!raw) {
    $("mkroom").onclick = () => { newRoom(); location.reload(); };
    return; // stay on the entry screen
  }

  $("gate").hidden = true;
  $("app").hidden = false;

  // Check for Ed25519 support once, up front.
  let pair;
  try {
    pair = await loadIdentity();
  } catch {
    canSign = false;
    note("This browser cannot sign messages. Yours will show as unverified.", true);
  }

  const pubB64 = canSign
    ? b64u.from(await crypto.subtle.exportKey("raw", pair.publicKey))
    : null;
  $("fp").textContent = pubB64 ? shortFP(pubB64) : "unavailable";

  const key = await aesKey(raw);
  const ch = await roomID(raw);

  $("share").value = location.href;

  // Nick is cosmetic and remembered locally. The fingerprint is the real
  // identity; two people can share a nick and still be told apart.
  const nickBox = $("nick");
  nickBox.value = localStorage.getItem("nick") || "anon";
  nickBox.oninput = () => localStorage.setItem("nick", nickBox.value);

  async function show(blob) {
    const m = await open(key, blob);
    if (!m) return; // not ours to read
    decayFrom = Date.now();
    paint(m, await verify(m));
  }

  connect(ch, async (f) => {
    // msgs is `omitempty` on the wire, so an empty room sends no array at
    // all. Iterating it directly throws on every join to a fresh room.
    if (f.op === "history") { for (const b of f.msgs || []) await show(b); }
    else if (f.op === "msg") { await show(f.body); }
    else if (f.op === "error") { note(f.err, true); }
  });

  $("say").onkeydown = async (e) => {
    if (e.key !== "Enter" || !e.target.value.trim()) return;
    const m = { ts: Date.now(), nick: nickBox.value.trim() || "anon", text: e.target.value };
    e.target.value = "";
    m.pub = pubB64;
    m.sig = canSign ? await sign(pair.privateKey, m) : null;
    sock.send(JSON.stringify({ op: "msg", ch, body: await seal(key, m) }));
  };
}

// A rejected boot() would otherwise be an unhandled promise: the console
// knows, the person looking at the page does not.
boot().catch((e) => {
  const why = "Startup failed: " + (e && e.message ? e.message : e);
  // Before the room opens, #log is still hidden — put it on the gate instead.
  if ($("app").hidden) {
    const p = document.querySelector("#gate p");
    p.style.color = "var(--alert)";
    p.textContent = why;
  } else {
    note(why, true);
  }
});
</script>
</body>
</html>
